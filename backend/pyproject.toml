[project]
name = "app"
version = "0.1.0-alpha"
description = "FastAPI project generated using minimal-fastapi-postgres-template."
authors = [{ name = "admin", email = "admin@example.com" }]
requires-python = ">=3.14,<4.0"
dependencies = [
    "alembic>=1.20.1,<2.0.0",
    "asyncpg==0.32.0",
    "bcrypt==5.0.0",
    "email-validator>=2.3.0,<3.0.0",
    "fastapi==0.162.0",
    "ijson>=3.6.0,<4.0.0",
    "mcp>=2.3.0",
    "mythic==0.3.0rc9",
    "ollama==0.6.3",
    "pydantic>=2.14.1,<3.0.0",
    "pydantic-settings>=2.16.1,<3.0.0",
    "pyjwt>=2.15.1,<3.0.0",
    "python-dotenv>=1.2.4,<2.0.0",
    "python-multipart>=0.0.32,<0.1.0",
    "pyyaml>=6.0.3,<7.0.0",
    "sqlalchemy[asyncio]>=2.1.6,<3.0.0",
    "autopep8>=2.3.2,<3.0.0",
    "redis>=8.0.0,<9.0.0",
    "g4f==8.8.6",
    "gql==4.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.17.0,<8.0.0",
    "freezegun>=1.5.5,<2.0.0",
    "greenlet>=3.5.6,<4.0.0",
    "httpx>=0.28.1,<0.29.0",
    "mypy>=2.4.0,<3.0.0",
    "pre-commit>=4.7.0,<5.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "ruff>=0.17.2,<0.18.0",
    "uvicorn[standard]>=0.54.0,<0.55.0",
]


[[tool.poetry.source]]
name = "mirror"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]

[tool.pytest.ini_options]
addopts = "-vv -n auto --cov --cov-report xml --cov-report term-missing --cov-fail-under=100"
asyncio_default_fixture_loop_scope = "session"
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.coverage.run]
concurrency = ["greenlet"]
omit = ["app/tests/*"]
source = ["app"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# FastAPI Depends ignore, that's why DMR better btw
ignore = ["E501", "B008"]
# pycodestyle, pyflakes, isort, pylint, pyupgrade, flake8-bugbear, Bandit, simplifications
select = ["E", "F", "I", "PL", "UP", "W", "B", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# ignore assert in tests, test creds
"app/tests/**/*.py" = ["S101", "S105", "S106"]
"alembic/*" = ["S101"]