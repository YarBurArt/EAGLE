[tool.poetry]
authors = ["admin <admin@example.com>"]
description = "FastAPI project generated using minimal-fastapi-postgres-template."
name = "app"
version = "0.1.0-alpha"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"

alembic = "^1.16.2"
asyncpg = "==0.31.0"
bcrypt = "==5.0.0"
fastapi = "==0.141.1"
pydantic = { extras = ["dotenv", "email"], version = "^2.11.7" }
pydantic-settings = "^2.10.1"
pyjwt = "^2.13.0"
python-multipart = "^0.0.32"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.41" }
mythic = "0.3.0rc8"
gql = "==4.0.0"
python-dotenv = "^1.1.0"
autopep8 = "^2.3.2"
g4f = "==8.2.6"
ollama = "==0.6.2"

[tool.poetry.group.dev.dependencies]
coverage = "^7.9.1"
freezegun = "^1.5.2"
greenlet = "^3.2.3"
httpx = "^0.28.1"
mypy = "^2.3.0"
pre-commit = "^4.2.0"
pytest = "^9.0.3"
pytest-asyncio = "^1.0.0"
pytest-cov = "^7.0.0"
pytest-xdist = "^3.8.0"
ruff = "^0.16.5"
uvicorn = {version = ">=0.52.4", extras = ["standard"]}

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]

[tool.pytest.ini_options]
addopts = "-vv -n auto --cov --cov-report xml --cov-report term-missing --cov-fail-under=100"
asyncio_default_fixture_loop_scope = "session"
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.coverage.run]
concurrency = ["greenlet"]
omit = ["app/tests/*"]
source = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pylint, pyupgrade
ignore = ["E501"]
select = ["E", "F", "I", "PL", "UP", "W"]
