name: ruff_check

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/ruff.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ruff.yml"

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: backend
          args: check --output-format=github
